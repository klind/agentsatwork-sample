name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the changelog step can compare with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Changelog entry
        if: github.event_name == 'pull_request'
        run: |
          number="${{ github.event.pull_request.number }}"
          added=$(git diff "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md | grep -E '^\+[^+]' || true)
          if ! echo "$added" | grep -qE "\(#${number}\)[[:space:]]*$"; then
            echo "CHANGELOG.md has no new line that ends with this pull request's number, (#${number})."
            echo "Every pull request adds a line under Unreleased in CHANGELOG.md that says what it changes"
            echo "and ends with its own number, for example: - \`GET /tasks\` lists the tasks. (#${number})"
            exit 1
          fi
